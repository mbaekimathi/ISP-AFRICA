# /etc/nginx/sites-available/net.richcom.co.ke
# ln -s /etc/nginx/sites-available/net.richcom.co.ke /etc/nginx/sites-enabled/
# certbot --nginx -d net.richcom.co.ke adds the 443 listener automatically.
server {
    listen 80;
    server_name net.richcom.co.ke;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
