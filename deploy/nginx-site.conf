# /etc/nginx/sites-available/net.richcom.co.ke
# ln -s /etc/nginx/sites-available/net.richcom.co.ke /etc/nginx/sites-enabled/
# certbot --nginx -d net.richcom.co.ke adds the 443 listener automatically.
#
# After certbot issues the certificate, redirect :80 to :443 and add HSTS:
#   add_header Strict-Transport-Security "max-age=31536000" always;

# Per-IP rate limits — the app enforces its own limits too; this is the edge.
limit_req_zone $binary_remote_addr zone=isp_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=isp_auth:10m rate=10r/m;

server {
    listen 80;
    server_name net.richcom.co.ke;

    # Bodies never exceed the app's 300 KB cap.
    client_max_body_size 350k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;

    # Login and registration are the brute-force targets — keep them tight.
    location ~ ^/api/(client|employee)/(login|register)$ {
        limit_req zone=isp_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=isp_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
